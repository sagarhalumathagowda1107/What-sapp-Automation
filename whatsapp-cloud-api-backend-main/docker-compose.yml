version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: whatsapp_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-whatsapp_reports}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHEY", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-whatsapp_reports}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - whatsapp_network

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: whatsapp_automation_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - PORT=8000
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-whatsapp_reports}
      - STORAGE_DIR=storage/reports
      - TIMEZONE=Asia/Kolkata
      - SCHEDULE_DAY_OF_WEEK=mon
      - SCHEDULE_HOUR=9
      - SCHEDULE_MINUTE=0
      - WHATSAPP_API_URL=https://graph.facebook.com
      - WHATSAPP_API_VERSION=v21.0
      - WHATSAPP_PHONE_NUMBER_ID=${WHATSAPP_PHONE_NUMBER_ID}
      - WHATSAPP_ACCESS_TOKEN=${WHATSAPP_ACCESS_TOKEN}
      - WHATSAPP_BUSINESS_ACCOUNT_ID=${WHATSAPP_BUSINESS_ACCOUNT_ID}
      - META_APP_SECRET=${META_APP_SECRET}
      - WEBHOOK_VERIFY_TOKEN=${WEBHOOK_VERIFY_TOKEN:-whatsapp_report_verify_token_secure}
      - WHATSAPP_TEMPLATE_NAME=${WHATSAPP_TEMPLATE_NAME:-weekly_report_document}
      - WHATSAPP_TEMPLATE_LANG=${WHATSAPP_TEMPLATE_LANG:-en_US}
    volumes:
      - pdf_storage:/app/storage/reports
      - app_logs:/app/logs
    networks:
      - whatsapp_network

volumes:
  postgres_data:
    driver: local
  pdf_storage:
    driver: local
  app_logs:
    driver: local

networks:
  whatsapp_network:
    driver: bridge
