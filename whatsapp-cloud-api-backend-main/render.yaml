services:
  # Web service running FastAPI + APScheduler
  - type: web
    name: whatsapp-report-backend
    env: python
    region: singapore
    plan: starter
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -m alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: whatsapp-reports-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: TIMEZONE
        value: Asia/Kolkata
      - key: SCHEDULE_DAY_OF_WEEK
        value: mon
      - key: SCHEDULE_HOUR
        value: 9
      - key: SCHEDULE_MINUTE
        value: 0
      - key: WHATSAPP_API_URL
        value: https://graph.facebook.com
      - key: WHATSAPP_API_VERSION
        value: v21.0
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_BUSINESS_ACCOUNT_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: WEBHOOK_VERIFY_TOKEN
        generateValue: true
    disk:
      name: report-storage
      mountPath: /app/storage/reports
      sizeGB: 10

databases:
  - name: whatsapp-reports-db
    plan: starter
    region: singapore
    databaseName: whatsapp_reports
    user: postgres
